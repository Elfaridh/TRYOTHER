<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css"><title>Dashboard - Rekap Sarpras</title></head><body>
<header class="topbar"><div id="topbar-brand" class="brand"></div></header><nav id="main-nav" class="nav"></nav>
<main class="container"><section class="grid grid-2"><div class="card"><div class="muted">Total Aset</div><div id="kpi-total" class="kpi">0</div></div><div class="card"><div class="muted">Kondisi Baik</div><div id="kpi-baik" class="kpi">0</div></div><div class="card"><div class="muted">Kondisi Rusak</div><div id="kpi-rusak" class="kpi">0</div></div><div class="card"><div class="muted">Perlu Perawatan</div><div id="kpi-rawat" class="kpi">0</div></div></section>
<section class="card"><h3>Identitas Lembaga</h3><p><strong>Daarul Amiin IBS</strong> — Rekap Sarpras Pesantren (Offline-First PWA)</p><p class="muted">Jika tampilan belum berubah, klik refresh 1x setelah versi di kanan menu berubah.</p></section></main>
<script type="module" src="js/dashboard.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    const reg = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
    reg.update();
    navigator.serviceWorker.addEventListener('controllerchange', ()=> window.location.reload());
  });
}
</script>
</body></html>
